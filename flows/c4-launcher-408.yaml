# Preconditions: a configured widget with a successful cached response is visible on the launcher.
# Set loopback-only stub mode=408 and delay=8000 before starting; restore success/0 afterward.
appId: com.google.android.apps.nexuslauncher
---
- pressKey: HOME
- assertVisible: "Abrir arribos de Tu Bondi"
- assertVisible: "Av. Duarte Quirós 1717–1728"
- tapOn: "Actualizar arribos"
- extendedWaitUntil:
    visible: "No pudimos actualizar; conservamos el último dato válido."
    timeout: 30000
- assertVisible: "Av. Duarte Quirós 1717–1728"
- assertVisible: "10"
