# Adds a descriptive favorite to the draft and verifies Back asks before discarding it.
# This flow never saves the draft, so it preserves the configured widget.
appId: com.google.android.apps.nexuslauncher
---
- pressKey: BACK
- pressKey: BACK
- pressKey: HOME
- assertVisible: "Abrir arribos de Tu Bondi"
- tapOn: "Abrir arribos de Tu Bondi"
- assertVisible: "Arribos por parada"
- tapOn: "Ajustes"
- assertVisible: "Lugares frecuentes"
- tapOn: "H Irigoyen (Parque Las Tejas)"
- assertVisible: "Cambios sin guardar"
- pressKey: BACK
- assertVisible: "¿Descartar cambios?"
- tapOn: "Descartar"
- assertVisible: "Arribos por parada"
