# Preconditions: a configured widget with a successful cached response is visible on the launcher.
# Set the loopback-only stub to mode=408 and delay=8000 before starting; restore success/0 afterward.
# Opening Arribos performs the refresh; this flow checks the resulting error and retained data.
appId: com.google.android.apps.nexuslauncher
---
- pressKey: BACK
- pressKey: HOME
- assertVisible: "Abrir arribos de Tu Bondi"
- tapOn: "Abrir arribos de Tu Bondi"
- assertVisible: "Arribos por parada"
- assertVisible: "Av. Duarte Quirós 1717–1728"
- extendedWaitUntil:
    visible: "No se pudo actualizar: Sin servicio ahora. Conservamos el último dato válido."
    timeout: 30000
- assertVisible: "Última actualización correcta"
- assertVisible: "Av. Duarte Quirós 1717–1728"
- assertVisible: "Línea 10"
